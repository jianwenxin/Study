name: Astar Lab tests
on:
  pull_request:
    paths: ['astar-lab/**', '.github/workflows/astar-lab-test.yml']
  push:
    branches: [main]
    paths: ['astar-lab/**', '.github/workflows/astar-lab-test.yml']
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test astar-lab/astar.test.mjs
