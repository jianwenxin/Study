<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>A* Pathfinding Lab</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#eef5ff;background:#0b1221}body{margin:0;padding:24px;max-width:1080px;margin-inline:auto}h1{font-size:clamp(1.7rem,4vw,2.7rem);margin-bottom:6px}p{color:#a9bdd9}.panel{background:#17243b;border:1px solid #30435e;border-radius:16px;padding:18px}header{margin-bottom:20px}button{border:1px solid #567497;background:#213858;color:white;border-radius:9px;padding:10px 14px;cursor:pointer;font-size:14px}button:hover{background:#35557a}button.active{background:#1969a7;border-color:#7cc9ff}.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:18px}.grid{display:grid;grid-template-columns:repeat(20,minmax(0,1fr));gap:3px;user-select:none;touch-action:manipulation}.cell{aspect-ratio:1;background:#263b56;border-radius:4px;min-width:0;cursor:pointer;transition:background .13s}.cell.wall{background:#070e1d}.cell.seen{background:#477d8e}.cell.path{background:#f3b94f}.cell.start{background:#39c994}.cell.goal{background:#fb667d}.legend{display:flex;flex-wrap:wrap;gap:18px;margin-top:18px;color:#bbcee8;font-size:13px}.swatch{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px}.status{margin:12px 0;color:#e5ecf8;font-weight:600}@media(max-width:650px){body{padding:12px}.panel{padding:10px}.grid{gap:2px}.cell{border-radius:2px}}
</style></head><body><header><h1>A* Pathfinding Lab</h1><p>科研算法可视化 · 四邻域网格 · 曼哈顿启发函数 · 单步代价为 1</p></header><section class="panel"><div class="toolbar"><button id="run">▶ 开始搜索</button><button data-mode="wall" class="active">绘制障碍</button><button data-mode="start">设置起点</button><button data-mode="goal">设置终点</button><button id="clear">清空障碍</button><button id="reset">重新生成</button></div><div id="grid" class="grid" role="grid" aria-label="路径规划地图"></div><div id="status" class="status" aria-live="polite">点击格子添加障碍，然后开始搜索。</div><div class="legend"><span><i class="swatch" style="background:#39c994"></i>起点</span><span><i class="swatch" style="background:#fb667d"></i>终点</span><span><i class="swatch" style="background:#070e1d"></i>障碍</span><span><i class="swatch" style="background:#477d8e"></i>探索</span><span><i class="swatch" style="background:#f3b94f"></i>最短路径</span></div></section><p>纯前端演示，无服务器、密钥或个人数据。适合教学、算法对照和 GitHub → Cloudflare 部署流程验证。</p><script type="module">
import {solve} from './astar.mjs';
const R=14,C=20,el=document.querySelector('#grid'),status=document.querySelector('#status');let grid,start,goal,mode='wall',token=0;
function init(){token++;grid=Array.from({length:R},()=>Array(C).fill(0));start=[3,2];goal=[10,17];draw();status.textContent='地图就绪。点击格子绘制障碍，或直接开始搜索。';}
function draw(){el.replaceChildren();for(let r=0;r<R;r++)for(let c=0;c<C;c++){const div=document.createElement('div');div.className='cell'+(grid[r][c]?' wall':'')+(r===start[0]&&c===start[1]?' start':'')+(r===goal[0]&&c===goal[1]?' goal':'');div.dataset.index=r*C+c;div.setAttribute('role','gridcell');div.setAttribute('aria-label',`行${r+1}列${c+1}`);el.append(div);}}
el.addEventListener('click',e=>{const cell=e.target.closest('.cell');if(!cell)return;token++;const i=Number(cell.dataset.index),r=Math.floor(i/C),c=i%C;if(mode==='start'){if(r===goal[0]&&c===goal[1])return;start=[r,c];grid[r][c]=0;}else if(mode==='goal'){if(r===start[0]&&c===start[1])return;goal=[r,c];grid[r][c]=0;}else if(!(r===start[0]&&c===start[1])&&!(r===goal[0]&&c===goal[1]))grid[r][c]=1-grid[r][c];draw();status.textContent='地图已修改，点击开始搜索。';});
document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;document.querySelectorAll('[data-mode]').forEach(x=>x.classList.toggle('active',x===b));});
document.querySelector('#clear').onclick=()=>{token++;grid.forEach(row=>row.fill(0));draw();status.textContent='障碍已清空。';};
document.querySelector('#reset').onclick=init;
document.querySelector('#run').onclick=async()=>{token++;let t=token;draw();let result=solve(grid,start,goal),cells=el.children;status.textContent='搜索中…';for(const [r,c] of result.visited){if(t!==token)return;let cell=cells[r*C+c];if(!cell.classList.contains('start')&&!cell.classList.contains('goal'))cell.classList.add('seen');await new Promise(resolve=>setTimeout(resolve,17));}if(t!==token)return;for(const [r,c] of result.path){let cell=cells[r*C+c];if(!cell.classList.contains('start')&&!cell.classList.contains('goal'))cell.classList.add('path');}status.textContent=result.cost===null?`不可达 · 已探索 ${result.visited.length} 个节点`:`最短距离 ${result.cost} 步 · 已探索 ${result.visited.length} 个节点 · 路径含 ${result.path.length} 个格子`;};
init();
</script></body></html>
